<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an account — FINTECH Payments</title>
  <meta name="description" content="Create your free FINTECH Payments account in about three minutes.">
  <meta name="theme-color" content="#4F46E5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" href="assets/images/favicon.ico" sizes="32x32">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script>
    (function () {
      var t = localStorage.getItem('theme');
      var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (t === 'dark' || (!t && d)) document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
</head>
<body class="auth-page">

  <button class="theme-toggle auth-theme-toggle" aria-label="Toggle theme"><i class="ph ph-moon"></i></button>

  <main class="auth-card animate-slide-up">
    <a href="index.html" class="auth-brand">
      <span class="logo-mark"><i class="ph-fill ph-lightning"></i></span> FINTECH
    </a>

    <h1 class="auth-title">Create account</h1>
    <p class="auth-sub">Free forever — no card required to sign up</p>

    <form data-validate="true">
      <div class="form-group">
        <label class="form-label" for="name">Full name</label>
        <input type="text" id="name" name="name" class="form-control" required placeholder="Jane Doe" autocomplete="name">
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input type="email" id="email" name="email" class="form-control" required placeholder="jane@example.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="pw-field">
          <input type="password" id="password" name="password" class="form-control" required placeholder="Minimum 8 characters" autocomplete="new-password">
          <button type="button" class="pw-toggle" data-pw-toggle="password" aria-label="Show password" aria-pressed="false">
            <i class="ph ph-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm password</label>
        <div class="pw-field">
          <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required placeholder="••••••••" autocomplete="new-password">
          <button type="button" class="pw-toggle" data-pw-toggle="confirmPassword" aria-label="Show password" aria-pressed="false">
            <i class="ph ph-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-group auth-terms">
        <label class="checkbox-group">
          <input type="checkbox" name="terms" required>
          <span style="font-size: var(--body-small); color: var(--text-secondary);">
            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
          </span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg auth-submit">Create my account</button>

      <div class="secure-notice">
        <i class="ph-fill ph-lock-key"></i> Secure connection established
      </div>
    </form>

    <div class="auth-divider"><span>or</span></div>

    <button type="button" class="btn btn-outline btn-block auth-social">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </button>
    <button type="button" class="btn btn-outline btn-block auth-social">
      <i class="ph ph-apple-logo" style="font-size: 1.2rem;"></i>
      Continue with Apple
    </button>

    <p class="auth-foot">Already have an account? <a href="login.html">Log in here</a></p>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
